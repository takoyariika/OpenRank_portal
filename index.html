<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>OpenRank Portal</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
